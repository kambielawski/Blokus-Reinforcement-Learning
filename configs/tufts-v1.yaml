# First Tufts run. Reasons and evidence are in the project's training plan.
# Start from imitation weights: scripts/pretrain_imitation.py, then --init-weights.

network:
  num_blocks: 10            # Doubled: the 5-block net is not the bottleneck yet, but
  channels: 128             # receptive field across a 20x20 board is. See plan.

mcts:
  num_simulations: 400
  c_puct: 1.5
  top_k_actions: 50         # Interior nodes, for speed
  root_top_k: 0             # Every legal move stays reachable at the root
  dirichlet_alpha: 0.1      # Lower than chess because the branching factor is ~300

training:
  learning_rate: 0.001
  batch_size: 256
  epochs_per_iter: 0.1      # Each example reused about 20 times over its life in the buffer
  iterations: 300
  replay_buffer_size: 300000
  value_loss_weight: 1.0    # Margin targets have variance near 0.5, not 0.003
  score_diff_targets: false
  margin_scale: 20.0        # Value target and terminal value: tanh(margin / 20 squares)
  mirror_augment: true
  lr_schedule:
    enabled: true
    warmup_iters: 5
    min_lr: 0.0001

self_play:
  games_per_iteration: 150
  num_workers: 24
  game_mode: dual

eval:
  interval: 5
  games: 0                  # Skip vs-random: it saturates and costs time
  mobility_pairs: 50
  mobility_sims: 100

checkpoint:
  dir: data/tufts-v1        # Overridden by the job script with a scratch path
  save_every_n_iters: 1
  keep_top_k: 1
  keep_every: 25            # Permanent history for the ladder

wandb:
  enabled: true
  run_name: tufts-v1

device: auto
