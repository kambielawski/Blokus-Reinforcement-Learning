# Short job to confirm the GPU is used and that resume works.
network: {num_blocks: 10, channels: 128}
mcts: {num_simulations: 100, top_k_actions: 50, root_top_k: 0, dirichlet_alpha: 0.1}
training: {batch_size: 256, epochs_per_iter: 1, iterations: 100, replay_buffer_size: 50000,
           value_loss_weight: 1.0, margin_scale: 20.0, rotation_augment: true,
           lr_schedule: {enabled: true, warmup_iters: 2, min_lr: 0.0001}}
self_play: {games_per_iteration: 24, num_workers: 24, game_mode: dual}
eval: {interval: 2, games: 0, mobility_pairs: 2, mobility_sims: 25}
checkpoint: {save_every_n_iters: 1, keep_top_k: 1, keep_every: 2}
wandb: {enabled: false}
device: auto
